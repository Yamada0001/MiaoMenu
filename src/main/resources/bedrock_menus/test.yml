menu:
  title: "§6§l主菜单" #标题
  subtitle: "§7欢迎来到服务器!" #头顶(其实是不知道怎么解释)
  footer: "§8服务器版本 1.21.x" #脚底(其实是不知道怎么解释)

  items: #物品类开始
    - text: "§e§l服务器信息\n§7点击查看服务器状态" #显示的名称
      icon: "textures/items/book_enchanted" #图标路径（可以使用资源包创造专属的图标）
      icon_type: "path" #可选项 PATH和URL 若URL icon项则填写图片直链 最佳32x32 64x64
      command: "" #要执行的命令 注:可使用%player%代替玩家名
      execute_as: "player" #可选项player(玩家执行) 、cmd（控制台执行）、message(发送消息)、close（关闭菜单）
      #后续都为同样的 请详细耐心为你的玩家打造一个特别的菜单吧！

    - text: "§a§l传送功能\n§7快速传送至各个地点"
      icon: "textures/items/compass_item"
      icon_type: "path"
      command: "warp"
      execute_as: "player"

    - text: "§b§l个人信息\n§7查看您的游戏数据"
      icon: "textures/items/empty_armor_slot_helmet"
      icon_type: "path"
      command: "profile"
      execute_as: "player"
      # 条件不满足时按钮显示为锁定状态 (§8[未解锁] 前缀)
      conditions:
        operator: AND
        requirements:
          - type: placeholder_contains
            placeholder: "%player_name%"
            value: ""
      lock_message: "&c尚未满足查看个人信息的条件。"

    - text: "§2§l商店系统\n§7购买和出售物品"
      icon: "textures/items/emerald"
      icon_type: "path"
      command: "shop"
      execute_as: "player"

    - text: "§d§l任务系统\n§7查看可接取的任务"
      icon: "textures/items/book_normal"
      icon_type: "path"
      command: "quests"
      execute_as: "player"

      # 条件组合示例: 需要完成成就 或 有任务权限 才能解锁
      conditions:
        operator: OR
        requirements:
          - type: advancement
            advancement: "minecraft:story/root"
          - type: permission
            permission: "quest.access"
      lock_message: "&c需要完成初始故事进度才能查看任务"

    - text: "§c§l小游戏\n§7参与有趣的小游戏"
      icon: "textures/items/diamond_sword"
      icon_type: "path"
      command: "games"
      execute_as: "player"

    - text: "§5§l好友系统\n§7管理您的好友列表"
      icon: "textures/items/name_tag"
      icon_type: "path"
      command: "friends"
      execute_as: "player"

    - text: "§9§l帮助信息\n§7查看服务器帮助"
      icon: "textures/items/paper"
      icon_type: "path"
      command: "help"
      execute_as: "player"

view_requirement:
  deny_message: "&c你当前无法打开基岩主菜单。"
  requirements:
    - type: permission
      permission: dgeysermenu.use

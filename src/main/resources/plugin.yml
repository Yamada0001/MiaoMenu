name: ${project.name}
version: ${project.version}
main: com.fluxcraft.MiaoMenu.MiaoMenu
api-version: '26.2'
description: 轻量级Java版和基岩版菜单插件
author: MingLi
folia-supported: true
softdepend: [floodgate, Floodgate, PlaceholderAPI, CraftEngine]
commands:
  dgeysermenu:
    description: 主命令
    usage: /<command> <open|reload|update|download|help>
    # mmy 只是别名，与主命令共用同一个 executor / tab 补全 / 权限检查
    aliases: [dgm, fluxmenu, mmy]
  getmenuclock:
    description: 获取菜单钟表
    usage: /<command>
    permission: dgeysermenu.admin
permissions:
  dgeysermenu.*:
    description: 所有权限
    children:
      dgeysermenu.use: true
      dgeysermenu.admin: true
      dgeysermenu.reload: true
      dgeysermenu.update: true
      dgeysermenu.download: true
  dgeysermenu.use:
    description: 使用菜单命令
    default: true
  dgeysermenu.admin:
    description: 管理权限
    default: op
  dgeysermenu.reload:
    description: 重载插件
    default: op
  dgeysermenu.update:
    description: 检查插件更新并接收更新提示
    default: op
  dgeysermenu.download:
    description: 下载并安装主题菜单
    default: op

name: Java CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

# 默认只读；只有发布 Release 的 job 单独提权到 contents: write
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Read project version
        id: version
        run: echo "value=$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml)" >> "$GITHUB_OUTPUT"

      - name: Compile
        run: mvn -B -q compile

      - name: Build and Test
        run: mvn -B verify

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiaoMenu-${{ github.sha }}
          # 排除 shade 之前的原始 jar，避免用户误用未重定位的产物
          path: |
            target/*.jar
            !target/original-*.jar

  release:
    needs: build
    # 只在向仓库推送提交时发布：PR、手动触发、删除分支都不产生 Release
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史，才能按 before..after 取出本次推送的所有提交
          fetch-depth: 0

      - name: Download shaded jar
        uses: actions/download-artifact@v4
        with:
          name: MiaoMenu-${{ github.sha }}
          path: dist

      - name: Compose release notes
        env:
          PYTHONIOENCODING: utf-8
          VERSION: ${{ needs.build.outputs.version }}
          # event payload 里的 message 换行会被转义，只取 username 做映射
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          env = os.environ
          repo = env.get("REPO_URL", "")
          before = env.get("BEFORE_SHA", "")
          after = env.get("AFTER_SHA", "")
          zero = "0" * 40

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True, encoding="utf-8")

          if before and before != zero and git("cat-file", "-e", before).returncode == 0:
              rev_args = ["%s..%s" % (before, after)]
          else:
              rev_args = ["-1", after]

          # 用 \x1f 分隔字段、\x1e 分隔记录，避免提交说明里的换行干扰解析
          raw = git("log", "--pretty=format:%H%x1f%an%x1f%ae%x1f%B%x1e", *rev_args).stdout
          records = [chunk for chunk in raw.split("\x1e") if chunk.strip()]

          users = {}
          for commit in json.loads(env.get("COMMITS_JSON") or "[]"):
              users[commit.get("id") or ""] = commit.get("author") or {}

          out = []
          out.append("## 版本\n")
          out.append("`%s` · build #%s\n" % (env.get("VERSION", ""), env.get("GITHUB_RUN_NUMBER", "")))
          out.append("## 提交叙述\n")

          if records:
              for record in records:
                  sha, name, email, message = record.split("\x1f", 3)
                  message = message.strip("\n")
                  author = users.get(sha) or {}
                  display = author.get("name") or name or "未知"
                  username = author.get("username") or ""
                  by = "%s (@%s)" % (display, username) if username else display
                  out.append("### %s\n" % sha[:7])
                  out.append("%s\n" % message)
                  out.append("- 作者：%s" % by)
                  out.append("- 链接：%s/commit/%s\n" % (repo, sha))
          else:
              out.append("_本次推送没有可展示的提交记录_\n")

          out.append("\n## 构建信息\n")
          out.append("- 分支：`%s`" % env.get("BRANCH", ""))
          out.append("- 推送者：%s" % env.get("ACTOR", ""))
          out.append("- 仓库：%s" % repo)
          out.append("- 运行记录：%s" % env.get("RUN_URL", ""))

          notes = "\n".join(out) + "\n"
          with open("release-notes.md", "w", encoding="utf-8") as handle:
              handle.write(notes)
          print(notes)
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}-build.${{ github.run_number }}
          # 引号必须保留：未加引号时 YAML 会把 " #" 之后当作注释丢弃
          name: "${{ needs.build.outputs.version }} build #${{ github.run_number }}"
          # 每次提交的自动构建是快照，不冒充正式版本；需要正式版时手动打 tag 即可
          prerelease: true
          fail_on_unmatched_files: true
          files: dist/*.jar
          body_path: release-notes.md

name: Java CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile
        run: mvn -B -q compile
      - name: Build and Test
        run: mvn -B verify
      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiaoMenu-${{ github.sha }}
          # 排除 shade 之前的原始 jar，避免用户误用未重定位的产物
          path: |
            target/*.jar
            !target/original-*.jar
